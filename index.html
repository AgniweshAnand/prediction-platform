<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Betting Engine</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --border: #1f2937;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --green: #10b981;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.5px; }
    
    button {
      background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 6px;
      font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .status-banner { text-align: center; color: var(--text-muted); font-size: 15px; padding: 30px; }
    
    .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .teams { font-size: 22px; font-weight: 700; }
    .timer { font-size: 18px; font-weight: 600; color: #fbbf24; }
    
    .bet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
    .team-btn {
      background: #1f2937; border: 1px solid #374151; color: var(--text); padding: 12px;
      border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; font-size: 14px;
    }
    .team-btn.active { border-color: var(--accent); background: #1e3a8a; }

    .input-row { display: flex; gap: 10px; margin-top: 10px; }
    input[type="number"] {
      flex: 1; background: #1f2937; border: 1px solid #374151; border-radius: 6px;
      padding: 10px 14px; color: #fff; font-size: 14px; outline: none;
    }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 500; }
    .won { color: var(--green); font-weight: 600; }
    .lost { color: var(--red); font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Sports Betting Simulation Terminal</h1>
    <button id="searchBtn" onclick="searchMatches()">Search for matches</button>
  </header>

  <!-- No match state -->
  <div id="noMatchCard" class="card status-banner">
    No match available. Make sure Python generated <code>custom_bets.csv</code> and click "Search for matches".
  </div>

  <!-- Live Match Workspace -->
  <div id="matchArea" class="card" style="display: none;">
    <div class="match-header">
      <div class="teams" id="matchTitle">Home vs Away</div>
      <div class="timer" id="clock">60s</div>
    </div>

    <div class="bet-grid">
      <div id="btnHome" class="team-btn" onclick="selectTeam('1')">
        <span id="homeLabel">Home (1)</span>
        <span id="homeOdds">1.0x</span>
      </div>
      <div id="btnAway" class="team-btn" onclick="selectTeam('2')">
        <span id="awayLabel">Away (2)</span>
        <span id="awayOdds">1.0x</span>
      </div>
    </div>

    <div class="input-row">
      <input type="number" id="stakeInput" placeholder="Enter stake amount (e.g. 50)" />
      <button id="placeBtn" onclick="submitBet()">Place Bet</button>
    </div>
  </div>

  <!-- Live Bet Stream -->
  <div id="streamCard" class="card" style="display: none;">
    <h3 style="margin-bottom: 8px; font-size: 15px;">Live Stream (custom_bets.csv)</h3>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>User</th>
          <th>Selection</th>
          <th>Stake</th>
        </tr>
      </thead>
      <tbody id="streamTable"></tbody>
    </table>
  </div>

  <!-- Final Settlement Area -->
  <div id="settleCard" class="card" style="display: none;">
    <h3 style="margin-bottom: 8px; font-size: 15px;">Settled Ledger (filtered.csv)</h3>
    <table>
      <thead>
        <tr>
          <th>User</th>
          <th>Pick</th>
          <th>Result</th>
          <th>Payout</th>
          <th>Profit/Loss</th>
        </tr>
      </thead>
      <tbody id="settleTable"></tbody>
    </table>
  </div>
</div>

<script>
  let activeMatch = null;
  let selectedTeamIndex = "1";
  let timeLeft = 60;
  let timerId = null;
  let streamQueue = [];
  let streamIndex = 0;

  function selectTeam(idx) {
    selectedTeamIndex = idx;
    document.getElementById("btnHome").classList.toggle("active", idx === "1");
    document.getElementById("btnAway").classList.toggle("active", idx === "2");
  }

  async function searchMatches() {
    const btn = document.getElementById("searchBtn");
    btn.disabled = true;
    btn.innerText = "Searching...";

    try {
      const res = await fetch("/api/match");
      const data = await res.json();

      if (!res.ok || !data.success) {
        throw new Error(data.message || "Match not found");
      }

      activeMatch = data.match;
      streamQueue = data.bets;
      startMatchSession();
    } catch (err) {
      document.getElementById("noMatchCard").style.display = "block";
      document.getElementById("noMatchCard").innerText = "No match available. " + err.message;
      document.getElementById("matchArea").style.display = "none";
      document.getElementById("streamCard").style.display = "none";
      document.getElementById("settleCard").style.display = "none";
    } finally {
      btn.disabled = false;
      btn.innerText = "Search for matches";
    }
  }

  function startMatchSession() {
    document.getElementById("noMatchCard").style.display = "none";
    document.getElementById("matchArea").style.display = "block";
    document.getElementById("streamCard").style.display = "block";
    document.getElementById("settleCard").style.display = "none";

    document.getElementById("matchTitle").innerText = `${activeMatch.Home_Team} vs ${activeMatch.Away_Team}`;
    document.getElementById("homeLabel").innerText = `${activeMatch.Home_Team} (1)`;
    document.getElementById("homeOdds").innerText = `${activeMatch.Home_Team_Odds}x`;
    document.getElementById("awayLabel").innerText = `${activeMatch.Away_Team} (2)`;
    document.getElementById("awayOdds").innerText = `${activeMatch.Away_Team_Odds}x`;

    selectTeam("1");

    // Reset clock and stream
    timeLeft = 60;
    streamIndex = 0;
    document.getElementById("streamTable").innerHTML = "";

    clearInterval(timerId);
    timerId = setInterval(onTick, 1000);
  }

  function onTick() {
    timeLeft--;
    document.getElementById("clock").innerText = `${timeLeft}s`;

    // Stream one bet from custom_bets.csv every ~2 seconds
    if (streamIndex < streamQueue.length && timeLeft % 2 === 0) {
      appendStreamRow(streamQueue[streamIndex]);
      streamIndex++;
    }

    if (timeLeft <= 0) {
      clearInterval(timerId);
      endBettingWindow();
    }
  }

  function appendStreamRow(row) {
    const tbody = document.getElementById("streamTable");
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${row["s.no"]}</td>
      <td style="font-weight:${row.user_id === 'user_me' ? '700; color:#60a5fa' : '400'}">${row.user_id}</td>
      <td>${row.User_Pick || activeMatch.Home_Team}</td>
      <td>$${parseFloat(row.bid_amount).toFixed(1)}</td>
    `;
    tbody.prepend(tr);
  }

  async function submitBet() {
    const input = document.getElementById("stakeInput");
    const amount = parseFloat(input.value);

    if (isNaN(amount) || amount <= 0) {
      alert("Please enter a valid stake amount.");
      return;
    }

    const teamPicked = selectedTeamIndex === "1" ? activeMatch.Home_Team : activeMatch.Away_Team;

    try {
      const res = await fetch("/api/bet", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ User_Pick: teamPicked, bid_amount: amount })
      });
      const data = await res.json();

      if (data.success) {
        input.value = "";
        appendStreamRow(data.bet);
      }
    } catch (err) {
      alert("Failed to submit bet to server: " + err.message);
    }
  }

  async function endBettingWindow() {
    document.getElementById("clock").innerText = "Closed";
    document.getElementById("placeBtn").disabled = true;
    document.getElementById("stakeInput").disabled = true;

    try {
      const res = await fetch("/api/settle", { method: "POST" });
      const data = await res.json();

      if (data.success) {
        renderSettlements(data.settlements);
      }
    } catch (err) {
      console.error("Settlement error:", err);
    }
  }

  function renderSettlements(rows) {
    document.getElementById("settleCard").style.display = "block";
    const tbody = document.getElementById("settleTable");
    tbody.innerHTML = "";

    rows.forEach(r => {
      const tr = document.createElement("tr");
      const isWon = r.Result === "WON";
      tr.innerHTML = `
        <td style="font-weight:${r.user_id === 'user_me' ? '700; color:#60a5fa' : '400'}">${r.user_id}</td>
        <td>${r.User_Pick}</td>
        <td class="${isWon ? 'won' : 'lost'}">${r.Result}</td>
        <td>$${parseFloat(r.payout_amount).toFixed(2)}</td>
        <td class="${r.net_profit >= 0 ? 'won' : 'lost'}">${r.net_profit >= 0 ? '+' : ''}$${parseFloat(r.net_profit).toFixed(2)}</td>
      `;
      tbody.appendChild(tr);
    });
  }
</script>

</body>
</html>
